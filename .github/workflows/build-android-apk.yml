name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'index.html'
      - 'premium.html'
      - 'netlify/functions/lib/catalog.mjs'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The file index is generated from the site's own pages on every build (read-only; the site is not modified).
      - name: Generate app catalog from index.html and premium.html
        run: node android/tools/gen-app-catalog.mjs

      # UI font: IBM Plex Sans Arabic (open source, SIL OFL) is downloaded at build time. If a download fails the app
      # simply uses the system font. (Apple's own SF fonts cannot be bundled in a third-party app.)
      - name: Download UI font
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/fonts
          for w in Regular SemiBold Bold; do
            if ! curl -fsSL --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-$w.ttf" -o "android/app/src/main/assets/fonts/arabic-$w.ttf"; then
              echo "::warning::Could not download font $w; the system font will be used."
              rm -f "android/app/src/main/assets/fonts/arabic-$w.ttf"
            fi
          done
          ls -la android/app/src/main/assets/fonts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional: a permanent signing key lets new APKs install over old ones.
      - name: Prepare release signing key (if secrets exist)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the release keystore from secrets."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a temporary debug key (updates over an older install will be refused)."
          fi

      - name: Build APK
        shell: bash
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 10thgradeps-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
