plugins {
    id 'com.android.application'
}

android {
    namespace 'net.tenthgradeps.app'
    compileSdk 34

    defaultConfig {
        applicationId 'net.tenthgradeps.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        resourceConfigurations += ['ar', 'en']
    }

    // Release signing comes from environment variables (set by the GitHub Actions workflow from repository
    // secrets). Without them the release build falls back to the debug key so that it still installs,
    // but that key changes between machines, so updates over an older install will be refused.
    signingConfigs {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('ANDROID_KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.security:security-crypto:1.0.0'
}
